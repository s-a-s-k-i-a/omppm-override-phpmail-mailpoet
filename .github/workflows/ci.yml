name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.3'
          - '8.4'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate versions
        run: php scripts/check-version.php

      - name: Unit tests
        run: composer test

      - name: Coding standards and compatibility
        run: composer lint

      - name: PHP syntax
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  playground:
    name: WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'

      - name: Verify class alias inside WordPress with MailPoet
        run: ./scripts/test-playground-controls.sh

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test release content guards
        run: ./scripts/test-release-contents.sh

      - name: Test SVN and public release verification guards
        run: ./scripts/test-svn-verification.sh

      - name: Build distribution
        run: ./scripts/build-release.sh

      - name: Extract distribution
        run: unzip -q dist/omppm-override-phpmail-mailpoet-*.zip -d plugin-check-build

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2
        with:
          build-dir: plugin-check-build/omppm-override-phpmail-mailpoet
          wp-version: latest

  e2e:
    name: MailPoet SMTP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, intl, curl, zip
          coverage: none
          tools: wp-cli
      - name: Exercise native MailPoet and SMTP delivery
        env:
          OMPPM_E2E_DB_HOST: 127.0.0.1:3306
          OMPPM_E2E_DB_USER: root
          OMPPM_E2E_DB_PASS: disposable-test-only
        run: ./scripts/test-e2e.sh
