name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.3'
          - '8.4'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate versions
        run: php scripts/check-version.php

      - name: Unit tests
        run: composer test

      - name: Coding standards and compatibility
        run: composer lint

      - name: PHP syntax
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  playground:
    name: WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify class alias inside WordPress with MailPoet
        run: ./scripts/test-playground.sh

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    # KNOWN RED on the imported 1.2.4 code: escaping (#3), i18n (#2),
    # debug.log file operations (#4), and "Tested up to" (#5). Make this job
    # blocking again (remove continue-on-error) once those ship in the next
    # release — the results and artifact stay visible either way.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test release content guards
        run: ./scripts/test-release-contents.sh

      - name: Build distribution
        run: ./scripts/build-release.sh

      - name: Extract distribution
        run: unzip -q dist/omppm-override-phpmail-mailpoet-*.zip -d plugin-check-build

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2
        with:
          build-dir: plugin-check-build/omppm-override-phpmail-mailpoet
          wp-version: latest
