name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  validate-build-release:
    name: Validate and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate tag and versions
        run: php scripts/check-version.php "${GITHUB_REF_NAME}"

      - name: Test and lint
        run: |
          composer test
          composer lint

      - name: Build release artifact
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.sha256 --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omppm-override-phpmail-mailpoet-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  deploy-wordpress-org:
    name: Deploy to WordPress.org
    needs: validate-build-release
    runs-on: ubuntu-latest
    environment: wordpress.org
    env:
      SLUG: omppm-override-phpmail-mailpoet
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Deploy tag to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          ASSETS_DIR: .wordpress-org
